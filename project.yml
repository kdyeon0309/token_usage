name: TokenBar
options:
  bundleIdPrefix: com.kdyeon0309
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
targets:
  TokenBar:
    type: application
    platform: macOS
    sources:
      - path: TokenBar/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdyeon0309.TokenBar
        PRODUCT_NAME: TokenBar
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: TokenBar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
    scheme:
      testTargets:
        - TokenBarTests
  TokenBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TokenBar/Tests
    dependencies:
      - target: TokenBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kdyeon0309.TokenBarTests
        GENERATE_INFOPLIST_FILE: YES

